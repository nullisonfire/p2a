<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZIP Explorer</title><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><style>
:root{color-scheme:dark;--bg:#080b10;--card:#11161f;--card2:#161d28;--line:#273142;--text:#f3f6fb;--muted:#929dac;--accent:#748cff;--accent2:#526be5;--hover:#192230}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0,#172039 0,transparent 28%),linear-gradient(135deg,#07090d,#0c1119);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text)}.wrap{width:min(1150px,calc(100% - 28px));margin:34px auto 60px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:20px}h1{margin:0;font-size:27px}.sub{color:var(--muted);font-size:13px;margin-top:7px}.nav{display:flex;gap:8px}.btn,button{border:0;border-radius:9px;background:var(--accent2);color:#fff;padding:10px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none}.secondary{background:#222c3b!important}.card{background:rgba(17,22,31,.92);border:1px solid var(--line);border-radius:14px;overflow:hidden}.toolbar{padding:14px;border-bottom:1px solid var(--line);display:flex;gap:9px;align-items:center;flex-wrap:wrap}.toolbar select,.toolbar input{background:#0b1017;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px;outline:none}.toolbar input{flex:1;min-width:220px}.meta,.crumb{padding:12px 15px;border-bottom:1px solid var(--line);color:var(--muted);font-size:13px}.list{padding:10px 15px}.row{display:grid;grid-template-columns:32px 1fr auto auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #1d2633}.row:last-child{border-bottom:0}.name{word-break:break-word}.folder{color:#dce4ff;font-weight:650;cursor:pointer}.size{color:var(--muted);font-size:12px}.smallbtn{padding:7px 10px;font-size:12px}.empty{padding:40px;text-align:center;color:var(--muted)}.status{display:none;margin:12px 15px 0;padding:10px;border-radius:9px;color:var(--muted);background:#151c27}.status.show{display:block}.foot{text-align:center;color:#5f6b7c;font-size:12px;margin-top:16px}@media(max-width:700px){.top{align-items:flex-start;flex-direction:column}.row{grid-template-columns:28px 1fr}.size{display:none}}
</style></head><body><div class="wrap"><div class="top"><div><h1>ZIP Explorer</h1><div class="sub">Browse generated PDF ZIPs and download individual files or a selected subset.</div></div><div class="nav"><a class="btn secondary" href="../pdf/">PDF Manager</a><a class="btn secondary" href="../">Course Viewer</a></div></div><div class="card"><div class="toolbar"><select id="zip"><option value="">Loading ZIPs…</option></select><input id="search" placeholder="Filter files…"><button id="all" class="secondary">Select visible</button><button id="clear" class="secondary">Clear</button><button id="download">Download selected</button></div><div id="status" class="status"></div><div id="meta" class="meta">Select a ZIP.</div><div id="crumb" class="crumb"></div><div id="list" class="list"><div class="empty">No ZIP selected.</div></div></div><div class="foot">ZIP contents are read from R2 and parsed in the browser.</div></div>
<script src="../config.js"></script><script>
const API=window.P2A_API_BASE||'';const $=id=>document.getElementById(id);let zip=null,currentKey='';let folder='';
function status(m){$('status').textContent=m;$('status').className='status show'}function esc(v){return String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function human(n){if(n<1024)return n+' B';let u=['KB','MB','GB','TB'],x=n/1024;for(const a of u){if(x<1024||a==='TB')return x.toFixed(2)+' '+a;x/=1024}return n+' B'}
async function get(path){const r=await fetch(API+path);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||`HTTP ${r.status}`);return d}
async function loadZips(){try{const d=await get('/api/zip/list');$('zip').innerHTML='<option value="">Select a ZIP…</option>'+d.zips.map(z=>`<option value="${esc(z.key)}">${esc(z.name)} — ${human(z.size)}</option>`).join('');if(d.zips.length===1){$('zip').value=d.zips[0].key;loadZip()} }catch(e){status(e.message)}}
async function loadZip(){currentKey=$('zip').value;folder='';if(!currentKey){zip=null;$('list').innerHTML='<div class="empty">No ZIP selected.</div>';return}status('Downloading ZIP…');const r=await fetch(API+'/api/zip/file?key='+encodeURIComponent(currentKey));if(!r.ok)throw Error('Could not download ZIP.');zip=await JSZip.loadAsync(await r.arrayBuffer());status('ZIP loaded.');render()}
function render(){if(!zip)return;const q=$('search').value.trim().toLowerCase();const prefix=folder;const dirs=new Set(),files=[];Object.values(zip.files).forEach(f=>{let n=f.name;if(prefix&&!n.startsWith(prefix))return;let rel=prefix?n.slice(prefix.length):n;if(!rel)return;let slash=rel.indexOf('/');if(slash>=0){const d=rel.slice(0,slash);if(d)dirs.add(d)}else if(!f.dir&&(!q||rel.toLowerCase().includes(q)))files.push(f)});let html='';[...dirs].sort((a,b)=>a.localeCompare(b)).forEach(d=>html+=`<div class="row"><div></div><div class="name folder" data-dir="${esc(prefix+d+'/')}">📁 ${esc(d)}</div><div class="size">Folder</div><div></div></div>`);files.sort((a,b)=>a.name.localeCompare(b.name)).forEach(f=>html+=`<div class="row file" data-name="${esc(f.name.toLowerCase())}"><input class="check" type="checkbox" value="${esc(f.name)}"><div class="name">📄 ${esc(f.name.slice(prefix.length))}</div><div class="size">${human(f._data?.uncompressedSize||0)}</div><button class="smallbtn secondary" data-file="${esc(f.name)}">Download</button></div>`);$('list').innerHTML=html||'<div class="empty">This folder is empty.</div>';document.querySelectorAll('[data-dir]').forEach(e=>e.onclick=()=>{folder=e.dataset.dir;render()});document.querySelectorAll('[data-file]').forEach(e=>e.onclick=()=>downloadFile(e.dataset.file));$('meta').textContent=currentKey.slice('pdf-zips/'.length)+' · '+Object.keys(zip.files).length+' entries';$('crumb').innerHTML='<span class="folder" id="root">Root</span>'+folder.split('/').filter(Boolean).map((p,i)=>` / <span class="folder" data-crumb="${esc(folder.split('/').slice(0,i+1).join('/')+'/')}">${esc(p)}</span>`).join('');$('root').onclick=()=>{folder='';render()};document.querySelectorAll('[data-crumb]').forEach(e=>e.onclick=()=>{folder=e.dataset.crumb;render()})}
async function downloadFile(name){const f=zip?.files[name];if(!f)return;const blob=await f.async('blob');const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name.split('/').pop();a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('zip').onchange=()=>loadZip().catch(e=>status(e.message));$('search').oninput=render;$('all').onclick=()=>document.querySelectorAll('.file:not([style*="display: none"]) .check').forEach(x=>x.checked=true);$('clear').onclick=()=>document.querySelectorAll('.check').forEach(x=>x.checked=false);$('download').onclick=async()=>{const names=[...document.querySelectorAll('.check:checked')].map(x=>x.value);if(!names.length)return;const out=new JSZip();for(const n of names)out.file(n,await zip.files[n].async('blob'));const blob=await out.generateAsync({type:'blob',compression:'DEFLATE'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(currentKey.split('/').pop()||'selected').replace(/\.zip$/i,'')+' - selected.zip';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};loadZips().catch(e=>status(e.message));
</script></body></html>
