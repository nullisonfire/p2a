<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Written Exam</title><link rel="stylesheet" href="../app.css"></head><body><main class="shell"><div class="top"><div><h1 id="title">Written Exam</h1><div id="meta" class="muted"></div></div><a class="btn" href="../">Back</a></div><div id="body" class="card">Loading…</div></main><script src="../config.js"></script><script>
const base=window.P2A_API_BASE||'';const id=new URLSearchParams(location.search).get('exam');function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
fetch(base+'/api/written?exam='+encodeURIComponent(id),{credentials:'include'}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error||'Failed');return d.data||d}).then(ex=>{document.querySelector('#title').textContent=ex.title||'Written Exam';document.querySelector('#meta').textContent=`${ex.total_marks||''} marks · ${ex.exam_duration||ex.duration||''} minutes`;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const levels=ex.levels||[];document.querySelector('#body').innerHTML=levels.map(level=>`<div class="level-heading"><h2>${esc(level.name)}</h2></div>${(level.groups||[]).map(group=>`${group.passage?`<div class="passage-card"><b>${esc(group.passage.header_title||'')}</b><div>${group.passage.passage_title||''}</div></div>`:''}${(group.questions||[]).map(q=>`<div class="q-card"><div class="q-header"><div class="q-body">${q.title||''}</div>${q.mark?`<span class="marks-badge">${esc(q.mark)} marks</span>`:''}</div>${q.children?`<div class="children">${q.children.map((c,i)=>`<div class="child-q"><div class="child-counter">${String.fromCharCode(97+i)}</div><div>${c.title||''}</div>${c.mark?`<span class="marks-badge">${esc(c.mark)}m</span>`:''}</div>`).join('')}</div>`:''}</div>`).join('')}`).join('')}`).join('')||'<p class="muted">No questions found.</p>'}).catch(e=>document.querySelector('#body').innerHTML='<div class="error">'+esc(e.message)+'</div>');
</script></body></html>
