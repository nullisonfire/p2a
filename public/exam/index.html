    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Hide loading overlay
            setTimeout(() => {
                document.getElementById('loadingOverlay').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('loadingOverlay').style.display = 'none';
                }, 300);
            }, 800);
            
            const questions = <?php echo json_encode($questions); ?>;
            const totalQuestions = questions.length;
            const positiveMarks = <?php echo $exam['positive_marks']; ?>;
            const negativeMarks = 0.5;
            const examDuration = <?php echo $exam['duration'] * 60; ?>;
            const maxPossibleMarks = <?php echo $exam['total_marks']; ?>;
            
            let currentQuestion = 0;
            let userAnswers = Array(totalQuestions).fill(null);
            let answeredQuestions = 0;
            let timeLeft = examDuration;
            let timerInterval;
            let totalMarks = 0;
            
            // Initialize the first question
            showQuestion(currentQuestion);
            updateProgress();
            startTimer();
            
            // Option click handler
            document.querySelectorAll('.option').forEach(option => {
                option.addEventListener('click', function() {
                    const questionIndex = parseInt(this.dataset.question);
                    const optionValue = this.dataset.option;
                    
                    if (userAnswers[questionIndex] === null) {
                        // Remove selected class from all options in this question
                        document.querySelectorAll(`.option[data-question="${questionIndex}"]`).forEach(opt => {
                            opt.classList.remove('selected');
                        });
                        
                        // Add selected class to clicked option
                        this.classList.add('selected');
                        
                        // Store user answer
                        userAnswers[questionIndex] = optionValue;
                        
                        // Check if answer is correct
                        const isCorrect = optionValue === questions[questionIndex]['answer'];
                        
                        // Update marks
                        if (isCorrect) {
                            totalMarks += positiveMarks;
                            playSound('correctSound');
                        } else {
                            totalMarks -= negativeMarks;
                            playSound('incorrectSound');
                        }

                        
                        // Update marks display
                        document.getElementById('current-marks').textContent = totalMarks.toFixed(2);
                        
                        // Show answer feedback
                        showAnswerFeedback(questionIndex, isCorrect);
                        
                        // Enable next button if not the last question
                        if (questionIndex < totalQuestions - 1) {
                            document.querySelector(`.next-btn[data-question="${questionIndex}"]`).disabled = false;
                        } else {
                            document.getElementById('submit-exam').disabled = false;
                        }
                        
                        // Update answered count
                        answeredQuestions++;
                        updateProgress();
                    }
                });
            });
            
            // Next button handler
            document.querySelectorAll('.next-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const questionIndex = parseInt(this.dataset.question);
                    currentQuestion = questionIndex + 1;
                    showQuestion(currentQuestion);
                });
            });
            
            // Skip button handler
            document.querySelectorAll('.skip-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const questionIndex = parseInt(this.dataset.question);
                    
                    // Mark as skipped (null answer)
                    userAnswers[questionIndex] = null;
                    
                    // Enable next button if not the last question
                    if (questionIndex < totalQuestions - 1) {
                        document.querySelector(`.next-btn[data-question="${questionIndex}"]`).disabled = false;
                    } else {
                        document.getElementById('submit-exam').disabled = false;
                    }
                    
                    // Move to next question if available
                    if (questionIndex < totalQuestions - 1) {
                        currentQuestion = questionIndex + 1;
                        showQuestion(currentQuestion);
                    }
                });
            });

            
            // Previous button handler
            document.querySelectorAll('.prev-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const questionIndex = parseInt(this.dataset.question);
                    currentQuestion = questionIndex - 1;
                    showQuestion(currentQuestion);
                });
            });
            
            // Submit exam handler
            document.getElementById('submit-exam').addEventListener('click', function() {
                calculateResults();
                stopTimer();
            });
            
            // Restart exam handler
            document.getElementById('restart-exam').addEventListener('click', function() {
                // Reset all values
                currentQuestion = 0;
                userAnswers = Array(totalQuestions).fill(null);
                answeredQuestions = 0;
                timeLeft = examDuration;
                totalMarks = 0;
                
                // Reset UI
                document.getElementById('questions-container').style.display = 'block';
                document.getElementById('exam-result').classList.remove('show');
                document.getElementById('current-marks').textContent = '0';
                
                // Reset all questions
                document.querySelectorAll('.question-container').forEach(container => {
                    container.querySelectorAll('.option').forEach(option => {
                        option.classList.remove('selected', 'correct', 'incorrect');
                    });
                    container.querySelector('.explanation').classList.remove('show');
                });
                
                // Reset progress
                updateProgress();
                
                // Show first question
                showQuestion(currentQuestion);
                
                // Reset timer
                stopTimer();
                startTimer();
                
                // Scroll to top
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
            
            // Theme toggle
            const themeColorPicker = document.getElementById('themeColor');
        
            // Apply saved color on load
            const savedColor = localStorage.getItem('themeColor');
            if (savedColor) {
                document.body.style.backgroundColor = savedColor;
                themeColorPicker.value = savedColor;
            }
        
            // Update color when user picks one
            themeColorPicker.addEventListener('input', function() {
                const color = themeColorPicker.value;
                document.body.style.backgroundColor = color;
                localStorage.setItem('themeColor', color);
            });
            

            
            // Back to top button
            document.getElementById('fab').addEventListener('click', function() {
                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
            });
            
            // Show/hide FAB based on scroll position
            window.addEventListener('scroll', function() {
                const fab = document.getElementById('fab');
                if (window.pageYOffset > 300) {
                    fab.style.display = 'flex';
                } else {
                    fab.style.display = 'none';
                }
            });
            
            function showQuestion(index) {
                // Hide all questions
                document.querySelectorAll('.question-container').forEach(q => {
                    q.classList.remove('active');
                });
                
                // Show current question
                const question = document.getElementById(`question-${index}`);
                question.classList.add('active');
                
                // Update current question number
                document.getElementById('current-question').textContent = index + 1;
                
                // If already answered, show the feedback
                if (userAnswers[index] !== null) {
                    const isCorrect = userAnswers[index] === questions[index]['answer'];
                    showAnswerFeedback(index, isCorrect);
                }
                
                // Scroll to question
                question.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
            
            function showAnswerFeedback(questionIndex, isCorrect) {
                const question = questions[questionIndex];
                const options = document.querySelectorAll(`.option[data-question="${questionIndex}"]`);
                
                // Skip if question was skipped
                if (userAnswers[questionIndex] === null) {
                    document.getElementById(`explanation-${questionIndex}`).classList.add('show');
                    return;
                }
                
                // Mark correct answer
                options.forEach(option => {
                    if (option.dataset.option === question['answer']) {
                        option.classList.add('correct');
                    }
                    
                    // Mark incorrect if selected wrong answer
                    if (option.dataset.option === userAnswers[questionIndex] && !isCorrect) {
                        option.classList.add('incorrect');
                    }
                });
                
                // Show explanation
                document.getElementById(`explanation-${questionIndex}`).classList.add('show');
            }
            
            function playSound(soundId) {
                const sound = document.getElementById(soundId);
                sound.currentTime = 0;
                sound.play().catch(e => console.log("Audio play failed:", e));
            }
            
            function updateProgress() {
                const progress = (answeredQuestions / totalQuestions) * 100;
                document.getElementById('progress-bar').style.width = `${progress}%`;
            }
            
            function calculateResults() {
                let correct = 0;
                let incorrect = 0;
                let unanswered = 0;
                
                for (let i = 0; i < totalQuestions; i++) {
                    if (userAnswers[i] === null) {
                        // Both skipped and blank count as unanswered
                        unanswered++;
                    } else if (userAnswers[i] === questions[i]['answer']) {
                        correct++;
                    } else {
                        incorrect++;
                    }
                }
                
                // Display results
                document.getElementById('questions-container').style.display = 'none';
                document.getElementById('exam-result').classList.add('show');
                
                // Animate score counting
                animateValue('correct-count', 0, correct, 800);
                animateValue('incorrect-count', 0, incorrect, 800);
                animateValue('unanswered-count', 0, unanswered, 800);
                animateValue('score', 0, totalMarks, 1000, 2);
            }

            
            function animateValue(id, start, end, duration, decimals = 0) {
                const obj = document.getElementById(id);
                let startTimestamp = null;
                const step = (timestamp) => {
                    if (!startTimestamp) startTimestamp = timestamp;
                    const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                    const value = progress * (end - start) + start;
                    obj.innerHTML = decimals === 0 ? Math.floor(value) : value.toFixed(decimals);
                    if (progress < 1) {
                        window.requestAnimationFrame(step);
                    }
                };
                window.requestAnimationFrame(step);
            }
            
            function startTimer() {
                updateTimerDisplay();
                timerInterval = setInterval(() => {
                    timeLeft--;
                    updateTimerDisplay();
                    
                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        calculateResults();
                    }
                }, 1000);
            }
            
            function stopTimer() {
                clearInterval(timerInterval);
            }
            
            function updateTimerDisplay() {
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                document.getElementById('timer').textContent = 
                    `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
                
                // Change color when time is running out
                const timerElement = document.getElementById('timer');
                if (timeLeft <= 60) {
                    timerElement.style.color = '#f72585';
                } else if (timeLeft <= 300) {
                    timerElement.style.color = '#f8961e';
                }
            }
            
            // Keyboard shortcuts
            document.addEventListener('keydown', function(e) {
                // Space or ArrowRight to go to next question
                if ((e.key === ' ' || e.key === 'ArrowRight') && currentQuestion < totalQuestions - 1) {
                    const nextBtn = document.querySelector(`.next-btn[data-question="${currentQuestion}"]`);
                    if (nextBtn && !nextBtn.disabled) {
                        e.preventDefault();
                        nextBtn.click();
                    }
                }
                
                // ArrowLeft to go to previous question
                if (e.key === 'ArrowLeft' && currentQuestion > 0) {
                    const prevBtn = document.querySelector(`.prev-btn[data-question="${currentQuestion}"]`);
                    if (prevBtn) {
                        e.preventDefault();
                        prevBtn.click();
                    }
                }
                
                // 1-5 to select options
                if (e.key >= '1' && e.key <= '5') {
                    const optionIndex = parseInt(e.key) - 1;
                    const options = ['a', 'b', 'c', 'd', 'e'];
                    if (optionIndex < options.length) {
                        const option = document.querySelector(`.option[data-question="${currentQuestion}"][data-option="${options[optionIndex]}"]`);
                        if (option && userAnswers[currentQuestion] === null) {
                            e.preventDefault();
                            option.click();
                        }
                    }
                }
                
                // Enter to submit exam
                if (e.key === 'Enter' && currentQuestion === totalQuestions - 1) {
                    const submitBtn = document.getElementById('submit-exam');
                    if (submitBtn && !submitBtn.disabled) {
                        e.preventDefault();
                        submitBtn.click();
                    }
                }
            });
        });
    </script>
</body>
</html>
