<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exam</title><link rel="stylesheet" href="../app.css"></head><body><main class="shell"><div class="top"><div><h1 id="title">Exam</h1><div id="meta" class="muted"></div></div><a class="btn" href="../">Back</a></div><div class="card"><div class="progress"><div id="bar"></div></div><div id="question" class="question">Loading…</div><div id="actions" class="actions"></div></div></main><script src="../config.js"></script><script>
const base=window.P2A_API_BASE||''; const qs=new URLSearchParams(location.search); const id=qs.get('id'); let exam=null,idx=0,answers={};
async function get(){const r=await fetch(base+'/api/exam?id='+encodeURIComponent(id),{credentials:'include'});const d=await r.json();if(!r.ok)throw Error(d.error||'Failed');exam=d;}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(){const qs=exam.question||[];const q=qs[idx];document.querySelector('#title').textContent=exam.title||'Exam';document.querySelector('#meta').textContent=`${qs.length} questions · ${exam.duration||''} minutes`;document.querySelector('#bar').style.width=((idx+1)/Math.max(qs.length,1)*100)+'%';let html=`<h2>Question ${idx+1}</h2><div>${q.question||''}</div>`;for(const o of ['a','b','c','d','e'])if(q[o])html+=`<div class="option ${answers[idx]===o?'correct':''}"><button onclick="choose('${o}')"><b>${o.toUpperCase()}.</b> ${q[o]}</button></div>`;document.querySelector('#question').innerHTML=html;document.querySelector('#actions').innerHTML=`${idx?'<button class="btn" onclick="prev()">Previous</button>':''}<button class="btn primary" onclick="next()">${idx===qs.length-1?'Finish':'Next'}</button>`}
function choose(o){answers[idx]=o;render()} function prev(){idx--;render()} function next(){if(idx<exam.question.length-1){idx++;render()}else{document.querySelector('#question').innerHTML='<h2>Completed</h2><p>Your answers are stored only in this page session.</p>';document.querySelector('#actions').innerHTML='<a class="btn primary" href="../">Return to courses</a>'}}
get().then(render).catch(e=>document.querySelector('#question').innerHTML='<div class="error">'+esc(e.message)+'</div>');
</script></body></html>
