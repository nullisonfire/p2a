<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>P2A PDF ZIP Manager</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#080b10;--card:#11161f;--card2:#161d28;--line:#273142;--text:#f3f6fb;--muted:#929dac;--accent:#748cff;--accent2:#526be5;--hover:#192230;--ok:#31d17c;--warn:#ffbd66;--danger:#ff687c}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0,#172039 0,transparent 28%),linear-gradient(135deg,#07090d,#0c1119);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text)}
.wrap{width:min(1100px,calc(100% - 28px));margin:34px auto 60px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:20px}h1{margin:0;font-size:28px;letter-spacing:-.6px}.sub{color:var(--muted);font-size:13px;margin-top:7px}.nav{display:flex;gap:8px;flex-wrap:wrap}.btn,button,select{appearance:none;border:1px solid var(--line);border-radius:9px;background:var(--accent2);color:white;padding:10px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none}.secondary{background:#222c3b!important}.btn:hover,button:hover{background:var(--accent)}button:disabled{opacity:.45;cursor:not-allowed}.card{background:rgba(17,22,31,.92);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.22)}.bar{padding:16px;display:grid;grid-template-columns:1fr auto auto auto;gap:10px;border-bottom:1px solid var(--line)}select{background:#0b1017;width:100%}.status{display:none;margin:14px 16px 0;padding:11px 13px;border-radius:9px;background:#18202b;color:var(--muted);font-size:13px}.status.show{display:block}.status.ok{color:#a9f3c8;border:1px solid #245d42}.status.warn{color:#ffd49b;border:1px solid #765326}.status.error{color:#ffabb7;border:1px solid #6e2b36}.course{display:none;padding:18px}.course.show{display:block}.course-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.course-title{font-size:21px;font-weight:800}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.stat{background:#0b1017;border:1px solid var(--line);border-radius:10px;padding:13px}.stat small{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.stat b{font-size:22px}.zipstate{padding:11px 13px;border-radius:9px;background:#151c27;color:var(--muted);margin-bottom:14px}.zipstate.ready{color:#9cf0bf;border:1px solid #245d42}.zipstate.update{color:#ffd49b;border:1px solid #765326}.actions{display:flex;gap:8px;flex-wrap:wrap}.lists{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.panel{background:#0b1017;border:1px solid var(--line);border-radius:10px;padding:13px}.panel h3{margin:0 0 10px;font-size:13px}.file{padding:9px 0;border-bottom:1px solid #1d2633}.file:last-child{border-bottom:0}.file-name{font-weight:650;font-size:13px}.file-path{color:#687589;font-size:11px;margin-top:3px;word-break:break-all}.empty{color:#687589;font-size:13px;padding:8px 0}.foot{text-align:center;color:#5f6b7c;font-size:12px;margin-top:16px}@media(max-width:700px){.top,.course-head{align-items:flex-start;flex-direction:column}.bar{grid-template-columns:1fr 1fr}.stats{grid-template-columns:repeat(2,1fr)}.lists{grid-template-columns:1fr}}
</style>
</head>
<body><div class="wrap">
<div class="top"><div><h1>P2A PDF ZIP Manager</h1><div class="sub">Create and incrementally update course PDF ZIPs from the PDFs already cached in R2.</div></div><div class="nav"><a class="btn secondary" href="../">Course Viewer</a><a class="btn secondary" href="../zip/">ZIP Explorer</a></div></div>
<div class="card">
<div class="bar"><select id="course"><option value="">Loading cached courses…</option></select><button id="refresh" class="secondary">Refresh</button><button id="openZip" class="secondary">Browse ZIPs</button></div>
<div id="status" class="status"></div>
<section id="courseCard" class="course"><div class="course-head"><div><div id="courseTitle" class="course-title"></div><div id="zipName" class="sub"></div></div></div>
<div class="stats"><div class="stat"><small>Total PDFs</small><b id="total">0</b></div><div class="stat"><small>Available</small><b id="available">0</b></div><div class="stat"><small>Missing</small><b id="missing">0</b></div><div class="stat"><small>In ZIP</small><b id="inside">0</b></div></div>
<div id="zipState" class="zipstate">Select a course.</div>
<div class="actions"><button id="generate">Create ZIP</button><button id="update" class="secondary">Update ZIP</button><button id="download" class="secondary">Download ZIP</button></div>
<div class="lists"><div class="panel"><h3>PDFs available for the ZIP</h3><div id="availableList"></div></div><div class="panel"><h3>Missing PDFs</h3><div id="missingList"></div></div></div>
</section></div><div class="foot">PDFs and generated ZIPs are stored in Cloudflare R2.</div></div>
<script src="../config.js"></script><script>
const API=window.P2A_API_BASE||'';const $=id=>document.getElementById(id);let current=null;
function esc(v){return String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function status(msg,type=''){const e=$('status');e.textContent=msg;e.className='status show '+type}
async function get(path,opt){const r=await fetch(API+path,opt);const d=await r.json().catch(()=>({error:'Invalid server response'}));if(!r.ok)throw Error(d.error||`HTTP ${r.status}`);return d}
async function loadCourses(){try{const d=await get('/api/pdf/courses');$('course').innerHTML='<option value="">Select a course…</option>'+d.courses.map(c=>`<option value="${esc(c.file)}">${esc(c.title)} (${c.pdfs})</option>`).join('');status(`${d.courses.length} cached course${d.courses.length===1?'':'s'} available.`,'ok')}catch(e){status(e.message,'error')}}
function renderList(el,items,empty){$(el).innerHTML=items.length?items.map(x=>`<div class="file"><div class="file-name">${esc(x.title)}</div><div class="file-path">${esc(x.entry||x.slug)}</div></div>`).join(''):`<div class="empty">${empty}</div>`}
async function loadCourse(){const file=$('course').value;if(!file){$('courseCard').classList.remove('show');return}try{status('Checking cached PDFs and ZIP…');const d=await get('/api/pdf/course?course='+encodeURIComponent(file));current=d;$('courseCard').classList.add('show');$('courseTitle').textContent=d.course.title;$('zipName').textContent=d.zip.filename;$('total').textContent=d.stats.total;$('available').textContent=d.stats.available;$('missing').textContent=d.stats.missing;const inside=d.zip.exists?0:0;$('inside').textContent=inside;const avail=d.pdfs.filter(x=>x.available),miss=d.pdfs.filter(x=>!x.available);renderList('availableList',avail,'No cached PDFs available.');renderList('missingList',miss,'All PDFs are cached.');const zs=$('zipState');zs.className='zipstate';if(!d.zip.exists){zs.textContent='ZIP not generated';$('generate').disabled=!avail.length;$('update').disabled=true;$('download').disabled=true}else{zs.textContent='ZIP exists. Use Update ZIP to rebuild it with any newly cached PDFs.';zs.className='zipstate ready';$('generate').disabled=true;$('update').disabled=!avail.length;$('download').disabled=false}status('Course loaded.','ok')}catch(e){status(e.message,'error')}}
async function buildZip(update){if(!current)return;const avail=current.pdfs.filter(x=>x.available);if(!avail.length)return status('No cached PDFs available.','warn');status(update?'Downloading existing ZIP and adding new PDFs…':'Creating ZIP from cached PDFs…');let zip=new JSZip();if(update&&current.zip.exists){const r=await fetch(API+'/api/zip/file?key='+encodeURIComponent(current.zip.key));if(!r.ok)throw Error('Could not read existing ZIP.');zip=await JSZip.loadAsync(await r.arrayBuffer())}let added=0;for(const p of avail){const entry=p.entry;if(zip.file(entry))continue;const r=await fetch(API+'/api/pdf?slug='+encodeURIComponent(p.slug));if(!r.ok)continue;const blob=await r.blob();if(blob.size) {zip.file(entry,blob);added++}}if(!added&&!update){/* first build still has files */}status('Compressing ZIP…');const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}});const r=await fetch(API+'/api/pdf/zip?course='+encodeURIComponent(current.course.file),{method:'POST',headers:{'Content-Type':'application/zip'},body:blob});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||`HTTP ${r.status}`);status(`${update?'ZIP updated':'ZIP created'} successfully (${added||zip.files?Object.keys(zip.files).length:0} files).`,'ok');await loadCourse()}
$('course').addEventListener('change',loadCourse);$('refresh').onclick=loadCourses;$('openZip').onclick=()=>location.href='../zip/';$('generate').onclick=()=>buildZip(false).catch(e=>status(e.message,'error'));$('update').onclick=()=>buildZip(true).catch(e=>status(e.message,'error'));$('download').onclick=()=>{if(current?.zip?.exists)location.href=API+'/api/zip/file?key='+encodeURIComponent(current.zip.key)};loadCourses();
</script></body></html>
