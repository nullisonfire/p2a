<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account</title><link rel="stylesheet" href="../app.css"></head><body><main class="shell"><div class="top"><h1>Account</h1><a class="btn" href="../">Back</a></div><div id="out" class="card">Loading…</div></main><script src="../config.js"></script><script>
const base=window.P2A_API_BASE||'';function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
fetch(base+'/api/profile',{credentials:'include'}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error||'Failed');return d}).then(d=>{const p=d.profile||{};const c=d.courses?.data||[];document.querySelector('#out').innerHTML=`<h2>${esc(p.name||p.username||'Profile')}</h2><p class="muted">${esc(p.email||'')}</p><h3>Authenticated courses</h3><div class="grid">${c.map(x=>`<div class="card"><b>${esc(x.title)}</b><div class="muted">${esc(x.slug)}</div><div>${esc(x.subscription_status?.status||x.subscription_status||'')}</div></div>`).join('')}</div>`}).catch(e=>document.querySelector('#out').innerHTML='<div class="error">'+esc(e.message)+'</div>');
</script></body></html>
