<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Answers</title><link rel="stylesheet" href="../app.css"></head><body><main class="shell"><div class="top"><div><h1 id="title">Answers</h1><div id="meta" class="muted"></div></div><a class="btn" href="../">Back</a></div><div id="list" class="card">Loading…</div></main><script src="../config.js"></script><script>
const base=window.P2A_API_BASE||'';const id=new URLSearchParams(location.search).get('id');function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
fetch(base+'/api/exam?id='+encodeURIComponent(id),{credentials:'include'}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error||'Failed');return d}).then(ex=>{document.querySelector('#title').textContent=ex.title||'Answers';document.querySelector('#meta').textContent=`${(ex.question||[]).length} questions`;document.querySelector('#list').innerHTML=(ex.question||[]).map((q,i)=>`<section class="question"><h3>${i+1}. ${q.question||''}</h3>${['a','b','c','d','e'].filter(o=>q[o]).map(o=>`<div class="option ${o===q.answer?'correct':''}"><b>${o.toUpperCase()}.</b> ${q[o]}</div>`).join('')}<p class="muted">${q.explanation||''}</p></section>`).join('')}).catch(e=>document.querySelector('#list').innerHTML='<div class="error">'+esc(e.message)+'</div>');
</script></body></html>
